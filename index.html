<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pinta Tus Uñas</title>

<style>
body {
  background:#111; color:#fff;
  font-family:Arial; text-align:center;
  padding:15px;
}
button {
  width:90%; padding:15px;
  margin-top:10px; font-size:18px;
  background:#ff00b3; color:white;
  border:none; border-radius:10px;
}
#canvas { margin-top:15px; width:100%; border-radius:10px; }
</style>
</head>

<body>

<h2>💅 Pinta Tus Uñas - Funciona de Verdad</h2>

<button onclick="pickEsmalte()">📸 Foto del esmalte</button>
<input id="esmalteInput" type="file" accept="image/*" style="display:none">

<button onclick="pickMano()">✋ Foto de tu mano</button>
<input id="manoInput" type="file" accept="image/*" style="display:none">

<p>Tocá una uña para pintarla</p>

<canvas id="canvas"></canvas>

<script>
let color = "rgb(255,0,150)";
let imgMano = null;

function pickEsmalte(){
  document.getElementById("esmalteInput").click();
}

document.getElementById("esmalteInput").addEventListener("change", e=>{
  let file = e.target.files[0];
  let img = new Image();
  img.src = URL.createObjectURL(file);
  img.onload = ()=>{
    let c = document.createElement("canvas");
    c.width=1; c.height=1;
    let ctx = c.getContext("2d");
    ctx.drawImage(img,0,0,1,1);
    let d = ctx.getImageData(0,0,1,1).data;
    color = `rgb(${d[0]},${d[1]},${d[2]})`;
    alert("Color detectado ✔️");
  }
});

function pickMano(){
  document.getElementById("manoInput").click();
}

document.getElementById("manoInput").addEventListener("change", e=>{
  let file = e.target.files[0];
  imgMano = new Image();
  imgMano.src = URL.createObjectURL(file);
  imgMano.onload = ()=> drawMano();
});

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function drawMano(){
  canvas.width = imgMano.width;
  canvas.height = imgMano.height;
  ctx.drawImage(imgMano,0,0);
}

// cuando toca una uña → pinta
canvas.addEventListener("click", e=>{
  if(!imgMano) return;

  let rect = canvas.getBoundingClientRect();
  let x = e.clientX - rect.left;
  let y = e.clientY - rect.top;

  // circulo suave de pintado
  const r = 45;

  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.clip();

  ctx.globalAlpha = 0.65;
  ctx.fillStyle = color;
  ctx.fillRect(x - r, y - r, r * 2, r * 2);

  ctx.restore();
  ctx.globalAlpha = 1;
});
</script>

</body>
</html>
