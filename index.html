<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UñApp PRO</title>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<style>
body {
    background:#111;
    color:#fff;
    font-family: Arial, sans-serif;
    text-align:center;
    margin:0;
    padding:15px;
}
h1 {
    font-size:26px;
    margin-top:10px;
}
button {
    width:90%;
    padding:15px;
    margin:10px 0;
    background:#FF00B3;
    border:none;
    border-radius:10px;
    font-size:18px;
    color:#fff;
    font-weight:bold;
}
video, canvas {
    width:100%;
    border-radius:12px;
    margin-top:15px;
}
</style>
</head>
<body>

<h1>💅 UñApp PRO</h1>
<p>Poné tu mano y mirá tus uñas pintadas en vivo</p>

<button onclick="pickColor()">📸 Elegir foto del esmalte</button>
<input id="colorInput" type="file" accept="image/*" style="display:none">

<video id="camera" autoplay playsinline></video>
<canvas id="output"></canvas>

<script>
let selectedColor = "rgb(255,0,255)"; // default rosa

function pickColor(){
    document.getElementById("colorInput").click();
}

document.getElementById("colorInput").addEventListener("change", e=>{
    let file = e.target.files[0];
    let img = new Image();
    img.src = URL.createObjectURL(file);
    img.onload = ()=>{
        selectedColor = getDominantColor(img);
        alert("Color tomado ✔️");
    }
});

// --- Detectar color dominante ---
function getDominantColor(img){
    let c = document.createElement("canvas");
    c.width=1; c.height=1;
    let ctx = c.getContext("2d");
    ctx.drawImage(img,0,0,1,1);
    let d = ctx.getImageData(0,0,1,1).data;
    return `rgb(${d[0]},${d[1]},${d[2]})`;
}

// --- MediaPipe Hands ---
const video = document.getElementById("camera");
const canvas = document.getElementById("output");
const ctx = canvas.getContext("2d");

const hands = new Hands({
    locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});
hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.6,
    minTrackingConfidence: 0.6
});
hands.onResults(onResults);

async function startCam(){
    const stream = await navigator.mediaDevices.getUserMedia({video:true});
    video.srcObject = stream;

    const camera = new Camera(video, {
        onFrame: async () => {
            await hands.send({image: video});
        },
        width: 1280,
        height: 720
    });
    camera.start();
}
startCam();

// --- FUNCIÓN PRINCIPAL: pintar uñas ---
function onResults(results){
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    if(!results.multiHandLandmarks[0]) return;

    const hand = results.multiHandLandmarks[0];

    // Puntas de los dedos (nails zone)
    const nails = [
        hand[4],   // pulgar
        hand[8],   // índice
        hand[12],  // mayor
        hand[16],  // anular
        hand[20]   // meñique
    ];

    // Dibujar uñas como círculos detectados (versión PRO simplificada)
    nails.forEach(n=>{
        paintNail(n.x, n.y);
    });
}

// --- pintar SOLO la uña ---
function paintNail(nx, ny){
    const x = nx * canvas.width;
    const y = ny * canvas.height;

    const radius = 35; // tamaño de uña aprox

    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI*2);
    ctx.clip();

    // multiplicar color para que respete textura
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = selectedColor;
    ctx.fillRect(x-radius, y-radius, radius*2, radius*2);

    ctx.restore();
    ctx.globalAlpha = 1.0;
}
</script>

</body>
</html>
