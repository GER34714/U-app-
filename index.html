<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UñApp PRO Realista</title>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>
body {
    background:#111;
    color:white;
    text-align:center;
    font-family:Arial;
    padding:15px;
}
button {
    width:90%;
    padding:15px;
    background:#FF00B3;
    border:none;
    border-radius:10px;
    font-size:18px;
    color:white;
    margin-top:10px;
    font-weight:bold;
}
video, canvas {
    width:100%;
    border-radius:12px;
    margin-top:15px;
}
</style>
</head>
<body>

<h1>💅 UñApp PRO Realista</h1>
<p>Color real del esmalte aplicado SOLO en las uñas.</p>

<button onclick="pickColor()">📸 Sacar foto del esmalte</button>
<input id="colorInput" type="file" accept="image/*" style="display:none">

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script>
let selectedColor = "rgb(255,0,255)";

function pickColor(){
    document.getElementById("colorInput").click();
}

document.getElementById("colorInput").addEventListener("change", e=>{
    let file = e.target.files[0];
    let img = new Image();
    img.src = URL.createObjectURL(file);
    img.onload = ()=>{
        selectedColor = getDominantColor(img);
        alert("Color detectado ✔️");
    }
});

function getDominantColor(img){
    let c = document.createElement("canvas");
    c.width=1; c.height=1;
    let ctx = c.getContext("2d");
    ctx.drawImage(img,0,0,1,1);
    let d = ctx.getImageData(0,0,1,1).data;
    return `rgb(${d[0]},${d[1]},${d[2]})`;
}

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

async function startCam(){
    const stream = await navigator.mediaDevices.getUserMedia({video:true});
    video.srcObject = stream;
}
startCam();

// HANDS
const hands = new Hands({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
});
hands.setOptions({
  maxNumHands: 1,
  modelComplexity: 1,
  minDetectionConfidence: 0.6,
  minTrackingConfidence: 0.6
});

// SEGMENTACIÓN (mano completa)
const segment = new SelfieSegmentation({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${f}`
});
segment.setOptions({modelSelection:1});

// Combinar ambos resultados
hands.onResults(results => draw(results));
segment.onResults(seg => (window.segMask = seg.segmentationMask));

const cam = new Camera(video, {
  onFrame: async () => {
    await segment.send({image: video});
    await hands.send({image: video});
  },
  width: 1280, height: 720
});
cam.start();

function draw(results){
    if(!window.segMask) return;

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    // Mostrar la cámara
    ctx.drawImage(video,0,0,canvas.width,canvas.height);

    if(!results.multiHandLandmarks[0]) return;

    const hand = results.multiHandLandmarks[0];

    // Uñas reales: usar 4 puntos por dedo
    const nailGroups = [
        [hand[4], hand[3], hand[2], hand[1]],   // pulgar
        [hand[8], hand[7], hand[6], hand[5]],   // índice
        [hand[12], hand[11], hand[10], hand[9]], // medio
        [hand[16], hand[15], hand[14], hand[13]],// anular
        [hand[20], hand[19], hand[18], hand[17]] // meñique
    ];

    nailGroups.forEach(poly => paintNailPolygon(poly));
}

function paintNailPolygon(poly){
    ctx.save();
    ctx.beginPath();

    poly.forEach((p,i)=>{
        let x = p.x * canvas.width;
        let y = p.y * canvas.height;
        if(i===0) ctx.moveTo(x,y);
        else ctx.lineTo(x,y);
    });
    ctx.closePath();
    ctx.clip();

    // Aplicar el color real del esmalte con textura natural
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = selectedColor;
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.restore();
    ctx.globalAlpha = 1;
}
</script>

</body>
</html>
