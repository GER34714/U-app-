<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>UñApp Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>
body{
  background:#111;
  color:#fff;
  text-align:center;
  font-family:Arial;
}
video,canvas{
  width:100%;
  border-radius:12px;
  margin-top:10px;
}
button{
  width:90%;
  padding:15px;
  background:#ff00b3;
  border:none;
  color:#fff;
  font-size:18px;
  border-radius:10px;
  margin-top:10px;
}
</style>
</head>

<body>

<h2>💅 UñApp Demo — Funciona YA</h2>
<p>Elegí el esmalte y se verá pintado en tus uñas</p>

<button onclick="pickColor()">📸 Elegir foto del esmalte</button>
<input id="colorInput" type="file" accept="image/*" style="display:none">

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script>
let color = "rgb(255,0,150)";

function pickColor(){ document.getElementById("colorInput").click(); }

document.getElementById("colorInput").addEventListener("change", e=>{
  let file = e.target.files[0];
  let img = new Image();
  img.src = URL.createObjectURL(file);
  img.onload = ()=>{
    let c = document.createElement("canvas");
    c.width=1; c.height=1;
    let ctx = c.getContext("2d");
    ctx.drawImage(img,0,0,1,1);
    let d = ctx.getImageData(0,0,1,1).data;
    color = `rgb(${d[0]},${d[1]},${d[2]})`;
    alert("Color detectado ✔");
  }
});

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

async function start(){
  const stream = await navigator.mediaDevices.getUserMedia({ video:true });
  video.srcObject = stream;
}
start();

const hands = new Hands({
  locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
});
hands.setOptions({ maxNumHands:1, minDetectionConfidence:0.6, minTrackingConfidence:0.6 });

hands.onResults(res=>{
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video,0,0,canvas.width,canvas.height);

  if(!res.multiHandLandmarks[0]) return;
  let h = res.multiHandLandmarks[0];

  // Puntas de los cinco dedos
  let nails = [h[4],h[8],h[12],h[16],h[20]];

  nails.forEach(n=>{
    let x = n.x * canvas.width;
    let y = n.y * canvas.height;

    ctx.save();
    ctx.beginPath();
    ctx.arc(x,y,28,0,Math.PI*2);
    ctx.clip();

    ctx.globalAlpha=0.45;
    ctx.fillStyle=color;
    ctx.fillRect(x-30,y-30,60,60);
    ctx.restore();
    ctx.globalAlpha=1;
  });
});

const cam = new Camera(video,{
  onFrame:async()=>{ await hands.send({image:video}); }
});
cam.start();
</script>

</body>
</html>
